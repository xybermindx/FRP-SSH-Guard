name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    secrets:
      FRP_GUARD_PRIVACY_RULES:
        required: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check source and history for private deployment details
        env:
          FRP_GUARD_PRIVACY_RULES: ${{ secrets.FRP_GUARD_PRIVACY_RULES }}
          REQUIRE_PRIVATE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          args=""
          if [ "$REQUIRE_PRIVATE" = true ]; then args="--require-private"; fi
          python3 scripts/privacy.py $args
          python3 scripts/privacy.py --history $args
      - name: Install build and kernel-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 dpkg nftables util-linux
      - name: Test and build
        env:
          FRP_GUARD_PRIVACY_RULES: ${{ secrets.FRP_GUARD_PRIVACY_RULES }}
        run: make release
      - name: Validate rules in an isolated network namespace
        run: sudo env FRP_GUARD_LIVE_TESTS=1 python3 -m unittest discover -s tests -v
      - name: Verify reproducibility and checksums
        env:
          FRP_GUARD_PRIVACY_RULES: ${{ secrets.FRP_GUARD_PRIVACY_RULES }}
        run: |
          cp dist/SHA256SUMS /tmp/first-build.sha256
          python3 scripts/build.py release
          cmp /tmp/first-build.sha256 dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Verify Debian 12 install, reinstall, removal, and purge
        run: docker run --rm -e FRP_GUARD_DISPOSABLE=1 -v "$PWD:/src:ro" debian:12 bash /src/tests/package-smoke.sh
      - name: Verify Ubuntu 24.04 install, reinstall, removal, and purge
        run: docker run --rm -e FRP_GUARD_DISPOSABLE=1 -v "$PWD:/src:ro" ubuntu:24.04 bash /src/tests/package-smoke.sh
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: release-artifacts
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error
