name: Release draft
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  release:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist
      - name: Check release contents for private deployment details
        env:
          FRP_GUARD_PRIVACY_RULES: ${{ secrets.FRP_GUARD_PRIVACY_RULES }}
        run: python3 scripts/privacy.py --require-private --artifacts dist/*.deb dist/SHA256SUMS
      - name: Check version and create draft with tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(python3 scripts/build.py version)
          application_version=$(cat VERSION)
          test "$RELEASE_TAG" = "v$application_version"
          package="dist/frp-ssh-guard_${application_version}.deb"
          test "$(dpkg-deb -f "$package" Version)" = "$package_version"
          notes="docs/RELEASE-v${application_version}.md"
          test -f "$notes" || notes=CHANGELOG.md
          (cd dist && sha256sum -c SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo 'Published release unchanged; validated artifacts are available for a maintainer-approved correction.'
              exit 0
            fi
            gh release upload "$RELEASE_TAG" "$package" dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" "$package" dist/SHA256SUMS --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file "$notes"
          fi
